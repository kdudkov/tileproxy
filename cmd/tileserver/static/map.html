<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Map</title>

    <!--    <link rel="stylesheet" href="/static/css/bootstrap.min.css"/>-->
    <link rel="stylesheet" href="/static/css/leaflet.css"/>
    <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body>

<div id="app">
    <div id="map" style="cursor:crosshair;"></div>
    <div id="status-bar">
        <img class="ms-1" height="24" src="/static/icons/coord_lock.png"
             v-if="locked_unit_uid" @click="locked_unit_uid=null"/>&nbsp;
        <span>{{ coords ? printCoordsll(coords) : '--' }}</span>
        <span class="sep">|</span>
        <span>zoom: {{ zoom }}</span>
        <span class="sep">|</span>
        <span>{{ layerName || '--' }}</span>
    </div>
    <div id="polygon-control">
        <button @click="toggleDrawing" :class="drawingMode ? 'btn-primary' : 'btn-secondary'">
            {{ drawingMode ? 'Завершить' : 'Нарисовать полигон' }}
        </button>
        <button v-if="drawingMode && polygonPoints.length > 0" @click="removeLastPoint" class="btn-warning">
            Удалить последнюю точку
        </button>
        <button v-if="polygonPoints.length > 0" @click="clearPolygon" class="btn-danger">
            Удалить полигон
        </button>
        <button v-if="!drawingMode && polygonPoints.length >= 3" @click="downloadPolygon" class="btn-primary">
            Скачать GeoJSON
        </button>
        <p v-if="polygonError" role="alert">{{ polygonError }}</p>
    </div>
</div>
</body>
<!--<script src="/static/js/bootstrap.bundle.min.js"></script>-->
<script src="/static/js/leaflet.js"></script>
<script src="/static/js/vue.js"></script>
<script src="/static/js/polygon.js"></script>
<script src="/static/js/main.js"></script>
</html>
